<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text → LaTeX</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><div class="eyebrow">OVERLEAF READY</div><h1>텍스트 → LaTeX</h1><p>사용 목적에 맞는 LaTeX 템플릿으로 변환합니다.</p></header><section class="grid"><div class="panel"><div class="panel-head"><h2>입력 텍스트</h2><span>Markdown 제목/목록 지원</span></div><label for="purpose">사용 목적</label><select id="purpose"><option value="report">보고서</option><option value="business">비즈니스 문서</option><option value="academic">학술/논문</option><option value="presentation">프레젠테이션</option></select><textarea id="input" placeholder="예시:\n나의 연구 노트\n\n이 문서는 일반 텍스트를 LaTeX로 변환합니다.\n\n- 첫 번째 항목\n- 두 번째 항목"></textarea><button id="convert">LaTeX로 변환</button></div><div class="panel"><div class="panel-head"><h2>생성된 LaTeX</h2><button class="copy" id="copy">클립보드 복사</button></div><pre id="output">변환 결과가 여기에 표시됩니다.</pre><div id="status"></div></div></section></main><script src="/static/app.js"></script></body></html>
