name: Build and publish Docker image

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/text-to-latex

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: text-to-latex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --rm --name text-to-latex-ci -p 8000:8000 text-to-latex:ci

      - name: Verify container and API
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<title>'
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"text":"Title\n\n- Item"}' \
            http://127.0.0.1:8000/api/convert | grep -q '\\documentclass'
          for i in {1..30}; do
            status="$(docker inspect -f '{{.State.Health.Status}}' text-to-latex-ci)"
            [[ "$status" == healthy ]] && break
            [[ "$status" == unhealthy ]] && exit 1
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' text-to-latex-ci)" = healthy

      - name: Show container logs on failure
        if: failure()
        run: docker logs text-to-latex-ci || true

      - name: Stop container
        if: always()
        run: docker stop text-to-latex-ci || true

  publish:
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Define image tags
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tags=${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
